# Copy to cotwatcher.toml, or point COTWATCHER_CONFIG at it.
#
# Every value is optional. The defaults are local Ollama with gpt-oss:20b for
# both roles, so cotwatcher works with no config file at all.
#
# Environment variables override the file:
#   COTWATCHER_MODEL_URL, COTWATCHER_MODEL_API_KEY, COTWATCHER_MODEL
#   COTWATCHER_JUDGE_URL, COTWATCHER_JUDGE_API_KEY, COTWATCHER_JUDGE_MODEL
#   COTWATCHER_JUDGE_EFFORT, COTWATCHER_RUBRIC, COTWATCHER_CONFIG

# How hard the judge should think: "low" | "medium" | "high", or "none" for
# endpoints that reject the parameter. This must sit above the sections below,
# or TOML reads it as part of whichever section precedes it. Writing it as
# `reasoning_effort` inside [judge] also works.
judge_reasoning_effort = "low"

# Path to your own rubric. Omit to use the bundled default.
# rubric_path = "rubrics/mine.yaml"

# The reasoning model being watched: what `cotwatcher trace` calls.
[model]
url = "http://localhost:11434/v1"
api_key = "ollama"
model = "qwen3:8b"

# The model that scores the reasoning: what `check` and `score` call.
# Same box, a sidecar, or hosted.
[judge]
url = "http://localhost:11434/v1"
api_key = "ollama"
model = "gpt-oss:20b"
