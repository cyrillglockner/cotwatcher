# Publish to PyPI when a GitHub release is created.
#
# Uses Trusted Publishing: PyPI is configured to trust this repository's
# `pypi` environment, so there is no API token to store. Set it up once at
# https://pypi.org/manage/account/publishing/ with:
#   owner cyrillglockner · repo cotwatcher · workflow release.yml · environment pypi
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx run build
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
