[project]
name = "cotwatcher"
version = "0.1.0a2"
description = "Watch the chain of thought of open-weight reasoning models and flag what you worry about."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cyrill Glockner" }]
keywords = ["llm", "chain-of-thought", "monitoring", "ai-safety", "reasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.50",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-reportlog>=0.4", "pyyaml>=6.0"]
# For the experiments in evals/, which run from a clone rather than the wheel:
#   git clone https://github.com/cyrillglockner/cotwatcher && cd cotwatcher
#   uv venv && uv pip install -e ".[evals]"
evals = [
  "pyyaml>=6.0",
  "pytest>=8",              # the pressure harness shells out to it
  "pytest-reportlog>=0.4",  # machine-readable test results the candidate cannot forge by exiting
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=4.40",
  "accelerate>=0.30",
]

[project.scripts]
cotwatcher = "cotwatcher.cli:main"

[project.urls]
Homepage = "https://github.com/cyrillglockner/cotwatcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotwatcher"]
# The guides ship inside the package so an installed copy carries them. A
# coding agent integrating cotwatcher works in someone else's repository and
# never sees this one; a link in the README reaches it only from GitHub or
# PyPI, and not offline.
force-include = { "docs/INTEGRATION.md" = "cotwatcher/docs/INTEGRATION.md", "docs/REVIEW.md" = "cotwatcher/docs/REVIEW.md" }

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "ollama", "README.md", "LICENSE", "pyproject.toml",
           # AGENTS.md before CLAUDE.md, which is a symlink to it: shipping the
           # link without its target leaves a dangling file in the sdist.
           "AGENTS.md", "CLAUDE.md", "PLAN.md", "STATUS.md", "FINDINGS.md", "BACKLOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
