[project]
name = "cotwatcher"
version = "0.1.0a1"
description = "Watch the chain of thought of open-weight reasoning models and flag what you worry about."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cyrill Glockner" }]
keywords = ["llm", "chain-of-thought", "monitoring", "ai-safety", "reasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.50",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/cyrillglockner/cotwatcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotwatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
